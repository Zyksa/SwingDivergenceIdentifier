name: Source and engine checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Check public sources
        shell: pwsh
        run: ./scripts/Test-PublicSource.ps1
      - name: Engine regression checks (no proprietary SDK required)
        run: dotnet run --project tests/StructureChecks.csproj -c Release
      - name: Check Deepcharts source syntax
        shell: pwsh
        run: ./scripts/Test-DeepchartsSource.ps1
      - name: Installer configuration and preflight checks
        shell: pwsh
        run: ./tests/InstallerChecks.ps1
